name: "Build"
description: "Build WASM, install dependencies, run tests, type-check, and build the app"

runs:
  using: "composite"
  steps:
    - name: Checkout emsdk
      uses: actions/checkout@v6
      with:
        repository: emscripten-core/emsdk
        path: emsdk

    - name: Get latest Jaci release
      id: luau-release
      shell: bash
      run: |
        # Fetch the latest release tag from Jaci-Lang/jaci (fallback to main if no release yet)
        RESPONSE=$(curl -s https://api.github.com/repos/Jaci-Lang/jaci/releases/latest)
        LATEST_TAG=$(echo "$RESPONSE" | jq -r '.tag_name // empty')
        if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
          echo "No GitHub release found on Jaci-Lang/jaci. Falling back to main branch."
          LATEST_TAG="main"
        fi
        echo "Latest Jaci release: $LATEST_TAG"
        echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

        if [ "$LATEST_TAG" = "main" ]; then
          COMMIT_HASH=$(curl -s https://api.github.com/repos/Jaci-Lang/jaci/commits/main | jq -r '.sha // "main"')
        else
          COMMIT_HASH=$(curl -s https://api.github.com/repos/Jaci-Lang/jaci/git/ref/tags/$LATEST_TAG | jq -r '.object.sha // "latest"')
        fi
        echo "Commit hash: $COMMIT_HASH"
        echo "commit=$COMMIT_HASH" >> "$GITHUB_OUTPUT"

    - name: Restore build cache
      uses: actions/cache@v5
      with:
        path: |
          emsdk
          wasm/build
          wasm/luau
          public/wasm/luau.wasm
          src/lib/luau/luau-module.js
        key: build-${{ runner.os }}-${{ hashFiles('wasm/src/**', 'wasm/CMakeLists.txt', 'wasm/build.sh') }}-luau-${{ steps.luau-release.outputs.commit }}
        restore-keys: |
          build-${{ runner.os }}-${{ hashFiles('wasm/src/**', 'wasm/CMakeLists.txt', 'wasm/build.sh') }}-luau-
          build-${{ runner.os }}-

    - name: Install Emscripten
      shell: bash
      run: |
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest

    - name: Clone or update Jaci
      shell: bash
      run: |
        TAG=${{ steps.luau-release.outputs.tag }}
        if [ ! -d "wasm/luau" ]; then
          if [ "$TAG" = "main" ]; then
            git clone --depth 1 https://github.com/Jaci-Lang/jaci.git wasm/luau
          else
            git clone --depth 1 --branch $TAG https://github.com/Jaci-Lang/jaci.git wasm/luau
          fi
        else
          cd wasm/luau
          git fetch origin $TAG
          git diff --quiet HEAD FETCH_HEAD || git reset --hard FETCH_HEAD
        fi

    - name: Build WASM
      shell: bash
      run: |
        source emsdk/emsdk_env.sh
        cd wasm
        ./build.sh release

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - name: Sync TextMate grammar
      shell: bash
      run: npm run sync:grammar

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Type check
      shell: bash
      run: npm run check

    - name: Build
      shell: bash
      run: npx vite build --base=./
